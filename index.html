<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nos retrouvailles</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 padding:12px;
 background:#171427;
 color:#fff0ef;
 font-family:system-ui,-apple-system,sans-serif;
}
.widget{
 max-width:650px;
 margin:auto;
 padding:25px 14px;
 background:linear-gradient(#24213f,#39304d);
 border-radius:22px;
 text-align:center;
 overflow:hidden;
}
h1{
 font-size:clamp(23px,5vw,32px);
 margin:0 0 12px;
}
.scene{
 width:100%;
 max-width:540px;
 height:260px;
 margin:auto;
 position:relative;
 overflow:hidden;
}
.person{
 position:absolute;
 bottom:0;
 width:clamp(85px,24%,125px);
 height:235px;
 object-fit:contain;
 object-position:bottom;
 transition:transform 1.2s ease;
}
#valentina{left:0}
#eliott{right:0}
#hug{
 display:none;
 position:absolute;
 left:50%;
 bottom:0;
 transform:translateX(-50%);
 height:100%;
 max-width:85%;
 object-fit:contain;
}
.heart{
 position:absolute;
 left:50%;
 top:22px;
 transform:translateX(-50%);
 font-size:30px;
 color:#f3a0b6;
 animation:pulse 1.6s infinite;
}
.heart.red{color:#ff304e}
@keyframes pulse{
 50%{transform:translateX(-50%) scale(1.2)}
}
.message{
 font-size:14px;
 color:#eddae9;
 margin:15px 0;
}
details{
 margin-top:20px;
 color:#d7c7dd;
 font-size:13px;
}
summary{cursor:pointer}
.controls{margin-top:12px}
button,input{
 padding:10px;
 border-radius:9px;
 font-size:14px;
 border:1px solid #c6b8d0;
}
button{
 background:#f0d8e4;
 color:#292035;
 margin:5px;
 cursor:pointer;
}
input{max-width:180px}
.note{
 font-size:12px;
 color:#cabbd1;
}
@media(max-width:420px){
 .scene{height:210px}
 .person{height:185px}
}
</style>
</head>
<body>
<main class="widget">
<h1 id="title">Nos prochains dodos ♡</h1>

<div class="scene" id="scene">
 <div class="heart" id="heart">♥</div>
 <img class="person" id="valentina"
 src="avatar-valentina.png" alt="Valentina">
 <img class="person" id="eliott"
 src="avatar-eliott.png" alt="Eliott">
 <img id="hug" src="avatar-calin.png"
 alt="Notre câlin">
</div>

<p class="message" id="message">
 Chargement de notre date...
</p>

<details>
 <summary>Tester le compte à rebours</summary>
 <div class="controls">
  <button id="testZero">Simuler 0 dodo</button>
  <button id="reset">Revenir à la vraie date</button>
 </div>
 <p class="note">
 Le test ne change pas notre vraie date.
 </p>
</details>
</main>

<script>
const zone="Europe/Paris";
const get=id=>document.getElementById(id);
let official=null;
let simulated=false;

function parisDate(){
 const parts=new Intl.DateTimeFormat("en-CA",{
  timeZone:zone,
  year:"numeric",
  month:"2-digit",
  day:"2-digit"
 }).formatToParts(new Date());
 const p=Object.fromEntries(
  parts.map(x=>[x.type,x.value])
 );
 return p.year+"-"+p.month+"-"+p.day;
}

function dayNumber(s){
 const a=s.split("-").map(Number);
 return Date.UTC(a[0],a[1]-1,a[2])/86400000;
}

function update(){
 if(!official)return;

 const target=official.date;
 const today=simulated?target:parisDate();
 const remaining=Math.max(
  0,dayNumber(target)-dayNumber(today)
 );
 const finished=remaining===0;

 get("title").textContent=finished
  ?"C'est aujourd'hui ♡"
  :"Plus que "+remaining+
   (remaining===1?" dodo ♡":" dodos ♡");

 get("valentina").style.display=
  finished?"none":"block";
 get("eliott").style.display=
  finished?"none":"block";
 get("hug").style.display=
  finished?"block":"none";

 get("heart").style.display=
  finished?"none":"block";

 get("message").textContent=finished
  ?"Enfin réunis, place au câlin ! ♡"
  :"Encore quelques dodos avant notre câlin ♡";

 if(!finished){
  const scene=get("scene");
  const a=get("valentina");
  const b=get("eliott");
  const width=scene.clientWidth;
  const avatarWidth=Math.max(
   a.getBoundingClientRect().width,
   b.getBoundingClientRect().width
  );
  const distance=Math.max(
   0,(width-2*avatarWidth-8)/2
  );
  const progress=Math.max(
   0,Math.min(1,1-remaining/14)
  );
  a.style.transform=
   "translateX("+(distance*progress)+"px)";
  b.style.transform=
   "translateX("+(-distance*progress)+"px)";
 }

 if(simulated){
  get("message").textContent+=" (simulation)";
 }
}

async function loadDate(){
 try{
  const response=await fetch(
   "date.json?v="+Date.now(),
   {cache:"no-store"}
  );
  if(!response.ok)throw Error("Date inaccessible");
  const data=await response.json();
  if(
   typeof data.date!=="string"||
   !/^\d{4}-\d{2}-\d{2}$/.test(data.date)
  )throw Error("Date incorrecte");
  official=data;
  update();
 }catch(error){
  if(!official){
   get("message").textContent=
    "Impossible de lire date.json.";
  }
 }
}

get("testZero").onclick=function(){
 if(!official)return;
 simulated=true;
 update();
};

get("reset").onclick=function(){
 simulated=false;
 update();
};

window.addEventListener("resize",update);
loadDate();
setInterval(update,15000);
setInterval(loadDate,60000);
</script>
</body>
</html>
