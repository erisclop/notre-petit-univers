<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nos retrouvailles ♡</title>
<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 padding:0;
 width:100%;
 height:100%;
 overflow:hidden;
}

body{
 background:#24213f;
 color:#fff0ef;
 font-family:system-ui,-apple-system,sans-serif;
}

.widget{
 width:100%;
 height:100vh;
 height:100dvh;
 min-height:0;
 margin:0 auto;
 padding:12px 12px;
 background:linear-gradient(180deg,#24213f,#39304d);
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 overflow:hidden;
 text-align:center;
}

h1{
 font-size:clamp(19px,4vw,26px);
 line-height:1.2;
 margin:0 0 6px;
 font-weight:750;
}

.scene{
 position:relative;
 width:100%;
 max-width:540px;
 height:190px;
 flex-shrink:1;
 min-height:105px;
 margin:0 auto;
 overflow:hidden;
}

.person{
 position:absolute;
 bottom:0;
 width:clamp(75px,23%,120px);
 height:100%;
 object-fit:contain;
 object-position:bottom;
 transition:transform 1.2s ease;
}

#valentina{left:0}
#eliott{right:0}

#hug{
 display:none;
 position:absolute;
 left:50%;
 bottom:0;
 transform:translateX(-50%);
 max-width:85%;
 height:100%;
 object-fit:contain;
 object-position:bottom;
}

.heart{
 position:absolute;
 z-index:2;
 left:50%;
 top:12px;
 transform:translateX(-50%);
 font-size:27px;
 color:#f3a0b6;
 animation:pulse 1.6s infinite;
}

@keyframes pulse{
 50%{
  transform:translateX(-50%) scale(1.2);
 }
}

.message{
 font-size:12px;
 color:#eddae9;
 line-height:1.3;
 margin:5px 0 0;
}

@media(max-width:480px){
 .widget{padding:8px}
 h1{font-size:19px}
 .scene{height:155px}
 .heart{top:8px}
}
</style>
</head>

<body>
<main class="widget">

<h1 id="title">Chargement des dodos ♡</h1>

<div class="scene" id="scene">

 <div class="heart" id="heart">♥</div>

 <img class="person" id="valentina"
 src="avatar-valentina.png" alt="Valentina">

 <img class="person" id="eliott"
 src="avatar-eliott.png" alt="Eliott">

 <img id="hug"
 src="avatar-calin.png"
 alt="Notre câlin">

</div>

<p class="message" id="message"></p>

</main>

<script>
const get=id=>document.getElementById(id);
let official=null;

function parisDate(){
 const parts=new Intl.DateTimeFormat("en-GB",{
  timeZone:"Europe/Paris",
  year:"numeric",
  month:"2-digit",
  day:"2-digit"
 }).formatToParts(new Date());

 const p=Object.fromEntries(
  parts.map(x=>[x.type,x.value])
 );

 return p.year+"-"+p.month+"-"+p.day;
}

function dayNumber(s){
 const [y,m,d]=s.split("-").map(Number);
 return Date.UTC(y,m-1,d)/86400000;
}

function update(){
 if(!official)return;

 const remaining=Math.max(
  0,
  dayNumber(official.date)-dayNumber(parisDate())
 );

 const finished=remaining===0;

 get("title").textContent=finished
  ?"C'est aujourd'hui ♡"
  :"Plus que "+remaining+
   (remaining===1?" dodo ♡":" dodos ♡");

 get("valentina").style.display=
  finished?"none":"block";

 get("eliott").style.display=
  finished?"none":"block";

 get("hug").style.display=
  finished?"block":"none";

 get("heart").style.display=
  finished?"none":"block";

 get("message").textContent=finished
  ?"Enfin réunis, place au câlin ! ♡"
  :"Encore quelques dodos avant notre câlin ♡";

 if(!finished){
  const scene=get("scene");
  const a=get("valentina");
  const b=get("eliott");

  const width=scene.clientWidth;
  const avatarWidth=Math.max(
   a.offsetWidth,
   b.offsetWidth
  );

  const distance=Math.max(
   0,(width-2*avatarWidth-8)/2
  );

  const progress=Math.max(
   0,Math.min(1,1-remaining/14)
  );

  a.style.transform=
   "translateX("+(distance*progress)+"px)";

  b.style.transform=
   "translateX("+(-distance*progress)+"px)";
 }
}

async function loadDate(){
 try{
  const r=await fetch(
   "date.json?t="+Date.now(),
   {cache:"no-store"}
  );

  if(!r.ok)throw Error("Date inaccessible");

  const data=await r.json();

  if(
   typeof data.date!=="string"||
   !/^\d{4}-\d{2}-\d{2}$/.test(data.date)
  ){
   throw Error("Date invalide");
  }

  official=data;
  update();

 }catch(e){
  if(!official){
   get("message").textContent=
    "Impossible de charger notre prochaine date.";
  }
 }
}

window.addEventListener("resize",update);

loadDate();

setInterval(update,15000);
setInterval(loadDate,60000);
</script>
</body>
</html>
